<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14192b"/>
      <stop offset="100%" stop-color="#0a0d17"/>
    </linearGradient>

    <!-- Neon Cyan-to-Blue Linear Gradient -->
    <linearGradient id="neonCyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Blue glow for right monitor -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Cyan glow for left monitor -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Soft outer glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left Monitor (Primary Host) -->
  <g filter="url(#subtleGlow)">
    <!-- Screen frame -->
    <rect x="22" y="38" width="46" height="34" rx="5" fill="#0f172a" fill-opacity="0.6" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    <!-- Stand stem -->
    <path d="M40 72 L38 80 L52 80 L50 72 Z" fill="#06b6d4" fill-opacity="0.7"/>
    <!-- Stand base -->
    <rect x="34" y="80" width="22" height="3" rx="1.5" fill="#00f2fe"/>
  </g>

  <!-- Right Monitor (Target Peer) -->
  <g filter="url(#subtleGlow)">
    <!-- Screen frame -->
    <rect x="52" y="32" width="54" height="42" rx="6" fill="#0b1329" fill-opacity="0.7" stroke="url(#blueGrad)" stroke-width="2.5"/>
    <!-- Stand stem -->
    <path d="M74 74 L71 84 L87 84 L84 74 Z" fill="#2563eb" fill-opacity="0.7"/>
    <!-- Stand base -->
    <rect x="67" y="84" width="24" height="3" rx="1.5" fill="#3b82f6"/>
  </g>

  <!-- Infinity Mesh Link Bridge -->
  <g filter="url(#neonGlow)">
    <!-- Infinite continuous loop spanning across both monitors -->
    <path d="M48 53
             C 41 43, 31 43, 31 53
             C 31 63, 41 63, 48 53
             C 55 43, 73 41, 83 48
             C 93 55, 91 66, 81 66
             C 71 66, 56 61, 48 53 Z"
          fill="none"
          stroke="url(#neonCyanBlue)"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Central Dynamic Cursor / Pointer -->
  <g filter="url(#neonGlow)" transform="translate(56, 46)">
    <!-- Cursor pointer arrow -->
    <path d="M0 0 L15 7 L8 10 L12 17 L8 19 L4 12 L-1 15 Z"
          fill="#00f2fe"
          stroke="#ffffff"
          stroke-width="1.2"
          stroke-linejoin="round"/>
  </g>
</svg>
